<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/jpeg" href="IMG_2283.jpeg">
  <title>MosalsaltHamza</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #E50914;
      --primary-hover: #F40612;
      --bg-root: #0A0A0A;
      --bg-default: #1A1A1A;
      --bg-secondary: #2A2A2A;
      --bg-tertiary: #333333;
      --text: #FFFFFF;
      --text-secondary: #B3B3B3;
      --border: #333333;
      --success: #46D369;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-root);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      direction: rtl;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 70px;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(10,10,10,0.9) 0%, transparent 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70%;
      background: linear-gradient(to top, var(--bg-root) 0%, rgba(10,10,10,0.6) 50%, transparent 100%);
    }

    .hero-content {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
    }

    .hero-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      background: var(--primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-year {
      background: rgba(255,255,255,0.2);
    }

    .hero-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .hero-description {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--text);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.3);
    }

    /* Content Rows */
    .content-section {
      padding: 20px 0;
    }

    .row-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      padding: 0 16px;
    }

    .content-row {
      display: flex;
      overflow-x: auto;
      padding: 0 16px;
      gap: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .content-row::-webkit-scrollbar {
      display: none;
    }

    /* Video Card */
    .video-card {
      flex-shrink: 0;
      width: 140px;
      cursor: pointer;
      transition: transform 0.2s;
      scroll-snap-align: start;
    }

    .video-card:hover {
      transform: scale(1.05);
    }

    .video-card.large {
      width: 180px;
    }

    .card-image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-default);
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .card-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: rgba(229,9,20,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }

    .card-play svg {
      width: 16px;
      height: 16px;
      fill: white;
      margin-left: 2px;
    }

    .card-quality {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--primary);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 600;
    }

    .card-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
    }

    .card-title {
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Series Card */
    .series-card {
      flex-shrink: 0;
      width: 120px;
      cursor: pointer;
      transition: transform 0.2s;
      scroll-snap-align: start;
    }

    .series-card:hover {
      transform: scale(1.05);
    }

    .series-image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-default);
    }

    .series-episodes {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(0,0,0,0.8);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      text-align: center;
    }

    .series-title {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Category Card */
    .category-card {
      flex-shrink: 0;
      width: 160px;
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
      scroll-snap-align: start;
    }

    .category-card:hover {
      transform: scale(1.03);
    }

    .category-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.3));
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .category-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    /* Tab Navigation */
    .tab-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 1000;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s;
    }

    .tab-item.active {
      color: var(--primary);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-label {
      font-size: 10px;
      font-weight: 500;
    }

    /* Video Player Modal */
    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      display: none;
      flex-direction: column;
    }

    .player-modal.active {
      display: flex;
    }

    .player-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(0,0,0,0.8);
      gap: 12px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .player-title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-container {
      flex: 1;
      background: #000;
      position: relative;
    }

    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--bg-secondary);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-footer {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.8);
      text-align: center;
    }

    .player-footer p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Series Detail Modal */
    .series-modal {
      position: fixed;
      inset: 0;
      background: var(--bg-root);
      z-index: 2000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .series-modal.active {
      display: flex;
    }

    .series-header {
      position: relative;
      height: 250px;
    }

    .series-header-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .series-header-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-root) 0%, rgba(10,10,10,0.5) 50%, transparent 100%);
    }

    .series-back-btn {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .series-info {
      padding: 0 16px 16px;
      margin-top: -60px;
      position: relative;
    }

    .series-info-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .series-info-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .episodes-section {
      padding: 0 16px 100px;
    }

    .episodes-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .episode-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg-default);
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .episode-item:hover {
      background: var(--bg-secondary);
    }

    .episode-thumb {
      width: 120px;
      aspect-ratio: 16/9;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .episode-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .episode-number {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .episode-title {
      font-size: 14px;
      font-weight: 500;
    }

    /* Search Screen */
    .search-container {
      padding: 80px 16px 16px;
    }

    .search-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      padding-right: 48px;
      background: var(--bg-default);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .search-results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .search-result-card {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .search-result-card:hover {
      transform: scale(1.03);
    }

    .search-result-image {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 6px;
      background: var(--bg-default);
    }

    .search-result-title {
      font-size: 11px;
      margin-top: 6px;
      text-align: center;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Categories Grid */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 80px 16px 100px;
    }

    .category-grid-item {
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .category-grid-item:hover {
      transform: scale(1.02);
    }

    /* Page visibility */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
    }

    /* Movies/Series Grid */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 80px 16px 100px;
    }

    .grid-card {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .grid-card:hover {
      transform: scale(1.03);
    }

    .grid-card-image {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 6px;
      background: var(--bg-default);
    }

    .grid-card-title {
      font-size: 11px;
      margin-top: 6px;
      text-align: center;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">M</div>
        <span class="logo-text">Mosalsalhamzafull</span>
      </div>
    </header>

    <!-- Home Page -->
    <div id="page-home" class="page active">
      <div class="hero" id="hero-section"></div>
      <div class="content-section" id="home-content"></div>
    </div>

    <!-- Series Page -->
    <div id="page-series" class="page">
      <div class="content-grid" id="series-grid"></div>
    </div>

    <!-- Movies Page -->
    <div id="page-movies" class="page">
      <div class="content-grid" id="movies-grid"></div>
    </div>

    <!-- Categories Page -->
    <div id="page-categories" class="page">
      <div class="categories-grid" id="categories-grid"></div>
    </div>

    <!-- Search Page -->
    <div id="page-search" class="page">
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" class="search-input" id="search-input" placeholder="ابحث عن فيلم أو مسلسل...">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button class="tab-item active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="tab-label">الرئيسية</span>
      </button>
      <button class="tab-item" data-tab="series">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
        <span class="tab-label">المسلسلات</span>
      </button>
      <button class="tab-item" data-tab="movies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span class="tab-label">الأفلام</span>
      </button>
      <button class="tab-item" data-tab="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span class="tab-label">الأقسام</span>
      </button>
      <button class="tab-item" data-tab="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <span class="tab-label">بحث</span>
      </button>
    </nav>
  </div>

  <!-- Video Player Modal -->
  <div class="player-modal" id="player-modal">
    <div class="player-header">
      <button class="back-btn" onclick="closePlayer()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>
      <span class="player-title" id="player-title"></span>
      <div style="width: 40px;"></div>
    </div>
    <div class="player-container">
      <div class="player-loading" id="player-loading">
        <div class="spinner"></div>
        <p style="color: var(--text-secondary);">جاري التحميل...</p>
      </div>
      <iframe class="player-iframe" id="player-iframe" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>
    <div class="player-footer">
      <p>اذا كان السيرفر بطيء يرجى الانتقال الى سيرفر اخر</p>
    </div>
  </div>

  <!-- Series Detail Modal -->
  <div class="series-modal" id="series-modal">
    <div class="series-header">
      <img class="series-header-image" id="series-header-image" src="" alt="">
      <div class="series-header-gradient"></div>
      <button class="series-back-btn" onclick="closeSeriesModal()">

      { id: "zwnvqn9vf", title: "المرسي", thumbnail: "https://larooza.top/uploads/thumbs/e850e081e-1.jpg", category: "arabic-series46", description: "مسلسل المرسي جميع الحلقات", episodes: [] },
      { id: "c9wkhluxy", title: "المؤسس اورهان", thumbnail: "https://larooza.top/uploads/thumbs/fb87b16b3-1.jpg", category: "turkish-3isk-seriess47", description: "مسلسل المؤسس اورهان مترجم", episodes: [] },
      { id: "wakpt3zsf", title: "محمد الفاتح", thumbnail: "https://larooza.top/uploads/thumbs/09ea5c567-1.jpg", category: "turkish-3isk-seriess47", description: "مسلسل محمد الفاتح جميع الحلقات", episodes: [] }

    const latestAdditions = [
      { id: "e96ebe860", title: "مسلسل على صدى الخلخال الحلقة 178 مدبلجة", thumbnail: "https://larooza.top/uploads/thumbs/e96ebe860-1.jpg", duration: "41:54", type: "episode", quality: "مدبلج" },
      { id: "e592cab18", title: "مسلسل على صدى الخلخال الحلقة 177 مدبلجة", thumbnail: "https://larooza.top/uploads/thumbs/e592cab18-1.jpg", duration: "44:43", type: "episode", quality: "مدبلج" },
      { id: "Y3pqkKEGu", title: "مسلسل ليل الحلقة 27", thumbnail: "https://larooza.top/uploads/thumbs/2feb048d0-1.jpg", duration: "41:03", type: "episode" },
      { id: "YyHrGAHfh", title: "مسلسل ليل الحلقة 26", thumbnail: "https://larooza.top/uploads/thumbs/2feb048d0-1.jpg", duration: "44:11", type: "episode" },
      { id: "05b8c043c", title: "مسلسل قسمة العدل الحلقة 15", thumbnail: "https://larooza.top/uploads/thumbs/07f7800d6-1.jpg", duration: "44:52", type: "episode" },
      { id: "d7c982fba", title: "مسلسل سر الحنين الحلقة 17 مدبلجة", thumbnail: "https://larooza.top/uploads/thumbs/d7c982fba-1.jpg", duration: "44:25", type: "episode", quality: "مدبلج" }
    ];

    const dubbedMovies = [
      { id: "111f9bd7c", title: "فيلم حياة الإمبراطور الجديدة 2000 مدبلج", thumbnail: "https://larooza.top/uploads/thumbs/111f9bd7c-1.jpg", duration: "1:50:35", year: "2000", quality: "مدبلج", type: "movie" },
      { id: "424628599", title: "فيلم زوتوبيا 2016 مدبلج", thumbnail: "https://larooza.top/uploads/thumbs/424628599-1.jpg", duration: "1:54:22", year: "2016", quality: "مدبلج", type: "movie" },
      { id: "93a35c04f", title: "فيلم العصر الجليدي 2002 مدبلج", thumbnail: "https://larooza.top/uploads/thumbs/93a35c04f-1.jpg", duration: "1:51:22", year: "2002", quality: "مدبلج", type: "movie" },
      { id: "dc098e486", title: "فيلم أخي الدب 2003 مدبلج", thumbnail: "https://larooza.top/uploads/thumbs/dc098e486-1.jpg", duration: "2:12:20", year: "2003", quality: "مدبلج", type: "movie" },
      { id: "f36a677d1", title: "فيلم إليو 2025 مدبلج", thumbnail: "https://larooza.top/uploads/thumbs/f36a677d1-1.jpg", duration: "1:38:54", year: "2025", quality: "مدبلج", type: "movie" }
    ];

    const allMovies = [...featuredMovies, ...dubbedMovies];
    const allSeries = [...trendingSeries];
    const allContent = [...allMovies, ...latestAdditions];

    // Helper Functions
    function getVideoPlayUrl(videoId) {
      return `https://larooza.top/play.php?vid=${videoId}`;
    }

    function createVideoCard(video, large = false) {
      return `
        <div class="video-card ${large ? 'large' : ''}" onclick="playVideo('${video.id}', '${video.title.replace(/'/g, "\\'")}')">
          <div class="card-image-container">
            <img class="card-image" src="${video.thumbnail}" alt="${video.title}" loading="lazy">
            <div class="card-gradient"></div>
            <div class="card-play">
              <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
            </div>
            ${video.quality ? `<span class="card-quality">${video.quality}</span>` : ''}
            ${video.duration ? `<span class="card-duration">${video.duration}</span>` : ''}
          </div>
          <p class="card-title">${video.title}</p>
        </div>
      `;
    }

    function createSeriesCard(series) {
      return `
        <div class="series-card" onclick="openSeriesModal('${series.id}')">
          <div class="series-image-container">
            <img class="card-image" src="${series.thumbnail}" alt="${series.title}" loading="lazy">
            ${series.episodes && series.episodes.length > 0 ? `<span class="series-episodes">${series.episodes.length} حلقات</span>` : ''}
          </div>
          <p class="series-title">${series.title}</p>
        </div>
      `;
    }

    function createCategoryCard(category) {
      return `
        <div class="category-card" onclick="filterByCategory('${category.id}')">
          <img class="category-image" src="${category.thumbnail}" alt="${category.nameAr}" loading="lazy">
          <div class="category-overlay">
            <span class="category-name">${category.nameAr}</span>
          </div>
        </div>
      `;
    }

    function createContentRow(title, items, renderFn) {
      return `
        <div class="content-section">
          <h2 class="row-title">${title}</h2>
          <div class="content-row">
            ${items.map(item => renderFn(item)).join('')}
          </div>
        </div>
      `;
    }

    // Render Functions
    function renderHero() {
      const hero = featuredMovies[0];
      document.getElementById('hero-section').innerHTML = `
        <img class="hero-image" src="${hero.thumbnail}" alt="${hero.title}">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-badges">
            ${hero.quality ? `<span class="badge">${hero.quality}</span>` : ''}
            ${hero.year ? `<span class="badge badge-year">${hero.year}</span>` : ''}
          </div>
          <h1 class="hero-title">${hero.title}</h1>
          ${hero.description ? `<p class="hero-description">${hero.description}</p>` : ''}
          <div class="hero-buttons">
            <button class="btn btn-primary" onclick="playVideo('${hero.id}', '${hero.title.replace(/'/g, "\\'")}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              تشغيل
            </button>
            <button class="btn btn-secondary" onclick="showInfo('${hero.id}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              المزيد
            </button>
          </div>
        </div>
      `;
    }

    function renderHomeContent() {
      let html = '';
      html += createContentRow('المسلسلات الرائجة', trendingSeries, createSeriesCard);
      html += createContentRow('أخر الإضافات', latestAdditions, createVideoCard);
      html += createContentRow('أفلام مميزة', featuredMovies, v => createVideoCard(v, true));
      html += createContentRow('أفلام مدبلجة', dubbedMovies, createVideoCard);
      document.getElementById('home-content').innerHTML = html;
    }

    function renderSeriesGrid() {
      document.getElementById('series-grid').innerHTML = allSeries.map(series => `
        <div class="grid-card" onclick="openSeriesModal('${series.id}')">
          <img class="grid-card-image" src="${series.thumbnail}" alt="${series.title}" loading="lazy">
          <p class="grid-card-title">${series.title}</p>
        </div>
      `).join('');
    }

    function renderMoviesGrid() {
      document.getElementById('movies-grid').innerHTML = allMovies.map(movie => `
        <div class="grid-card" onclick="playVideo('${movie.id}', '${movie.title.replace(/'/g, "\\'")}')">
          <img class="grid-card-image" src="${movie.thumbnail}" alt="${movie.title}" loading="lazy">
          <p class="grid-card-title">${movie.title}</p>
        </div>
      `).join('');
    }

    function renderCategoriesGrid() {
      document.getElementById('categories-grid').innerHTML = categories.map(category => `
        <div class="category-grid-item" onclick="filterByCategory('${category.id}')">
          <img class="category-image" src="${category.thumbnail}" alt="${category.nameAr}" loading="lazy">
          <div class="category-overlay">
            <span class="category-name">${category.nameAr}</span>
          </div>
        </div>
      `).join('');
    }

    // Navigation
    function switchTab(tabName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(`page-${tabName}`).classList.add('active');
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    }

    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    // Video Player
    function playVideo(videoId, title) {
      document.getElementById('player-title').textContent = title;
      document.getElementById('player-loading').style.display = 'flex';
      document.getElementById('player-iframe').src = getVideoPlayUrl(videoId);
      document.getElementById('player-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
      
      document.getElementById('player-iframe').onload = function() {
        document.getElementById('player-loading').style.display = 'none';
      };
    }

    function closePlayer() {
      document.getElementById('player-modal').classList.remove('active');
      document.getElementById('player-iframe').src = '';
      document.body.style.overflow = '';
    }

    // Series Modal
    function openSeriesModal(seriesId) {
      const series = allSeries.find(s => s.id === seriesId);
      if (!series) return;

      document.getElementById('series-header-image').src = series.thumbnail;
      document.getElementById('series-info-title').textContent = series.title;
      document.getElementById('series-info-desc').textContent = series.description || '';

      const episodesList = document.getElementById('episodes-list');
      if (series.episodes && series.episodes.length > 0) {
        episodesList.innerHTML = series.episodes.map(ep => `
          <div class="episode-item" onclick="playVideo('${ep.id}', '${ep.title.replace(/'/g, "\\'")}')">
            <img class="episode-thumb" src="${ep.thumbnail}" alt="${ep.title}" loading="lazy">
            <div class="episode-info">
              <span class="episode-number">الحلقة ${ep.episodeNumber}</span>
              <span class="episode-title">${ep.title}</span>
            </div>
          </div>
        `).join('');
      } else {
        episodesList.innerHTML = '<div class="empty-state"><p>لا توجد حلقات متاحة</p></div>';
      }

      document.getElementById('series-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSeriesModal() {
      document.getElementById('series-modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Search
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.trim().toLowerCase();
      const results = document.getElementById('search-results');

      if (query.length < 2) {
        results.innerHTML = '';
        return;
      }

      const filtered = allContent.filter(item => 
        item.title.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        results.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>لا توجد نتائج</p></div>';
        return;
      }

      results.innerHTML = filtered.map(item => `
        <div class="search-result-card" onclick="playVideo('${item.id}', '${item.title.replace(/'/g, "\\'")}')">
          <img class="search-result-image" src="${item.thumbnail}" alt="${item.title}" loading="lazy">
          <p class="search-result-title">${item.title}</p>
        </div>
      `).join('');
    });

    // Filter by category (placeholder)
    function filterByCategory(categoryId) {
      alert('تم اختيار القسم: ' + categories.find(c => c.id === categoryId)?.nameAr);
    }

    // Show info (placeholder)
    function showInfo(videoId) {
      const video = allMovies.find(v => v.id === videoId) || latestAdditions.find(v => v.id === videoId);
      if (video) {
        alert(`${video.title}\n\n${video.description || 'لا يوجد وصف متاح'}`);
      }
    }

    // Initialize
    renderHero();
    renderHomeContent();
    renderSeriesGrid();
    renderMoviesGrid();
    renderCategoriesGrid();

    // Handle escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePlayer();
        closeSeriesModal();
      }
    });
  </script>
